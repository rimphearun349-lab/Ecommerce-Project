# Application

spring.application.name=ecommerce

# SQL Server Database

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ecommerce_db;encrypt=true;trustServerCertificate=true
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ecommerce_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}

# JPA / Hibernate

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server

# server.port=8080
server.port=${PORT:8080}

# Error responses (development)

server.error.include-message=always
server.error.include-binding-errors=always

# First admin account

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}

# JWT Security

app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# CORS

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ABA PayWay

payway.merchant-id=${PAYWAY_MERCHANT_ID:}
payway.api-key=${PAYWAY_API_KEY:}
payway.base-url=${PAYWAY_BASE_URL:https://checkout-sandbox.payway.com.kh}
payway.return-url=${PAYWAY_RETURN_URL:}
payway.frontend-url=${FRONTEND_URL:http://localhost:3000}